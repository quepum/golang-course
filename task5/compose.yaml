services:
  api:
    image: api:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.api
    container_name: api
    restart: unless-stopped
    ports:
      - "28080:8080"
    volumes:
      - ./repo-stat/api/config/config.yaml:/config.yaml
    environment:
      - SUBSCRIBER_ADDRESS=subscriber:8080
      - PROCESSOR_ADDRESS=processor:8082
    depends_on:
      - subscriber
      - processor

  subscriber:
    image: subscriber:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.subscriber
    container_name: subscriber
    restart: unless-stopped
    ports:
      - "28081:8080"
    volumes:
      - ./repo-stat/subscriber/config/config.yaml:/config.yaml
    environment:
      - DB_DSN=postgres://user:password@postgres:5432/subscriptions_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  processor:
    image: processor:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.processor
    container_name: processor
    restart: unless-stopped
    ports:
      - "28082:8082"
    volumes:
      - ./repo-stat/processor/config/config.yaml:/config.yaml
    environment:
      - KAFKA_BROKER=kafka:9092
      - DB_DSN=postgres://user:password@postgres_processor:5432/processor_db?sslmode=disable
    depends_on:
      postgres_processor:
        condition: service_healthy
      kafka:
        condition: service_started

  collector:
    image: collector:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.collector
    container_name: collector
    restart: unless-stopped
    ports:
      - "28083:8083"
    volumes:
      - ./repo-stat/collector/config/config.yaml:/config.yaml
    environment:
      - SUBSCRIBER_ADDRESS=subscriber:8080
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - subscriber
      - kafka

  tests:
    image: tests:latest
    build:
      context: tests
    container_name: tests
    restart: "no"
    depends_on:
      - api
    entrypoint: ["true"]

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subscriptions_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d subscriptions_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka

  postgres_processor:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: processor_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_processor:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d processor_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata_processor:
  kafka_data: