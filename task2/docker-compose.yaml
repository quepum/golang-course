version: '3.9'

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: collector-service
    ports:
      - "50051:50051"
    networks:
      - app-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - COLLECTOR_ADDR=collector:50051
    depends_on:
      - collector
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge