definitions:
  domain.RepoInfo:
    properties:
      created_at:
        type: string
      description:
        type: string
      forks_count:
        type: integer
      name:
        type: string
      stargazers_count:
        type: integer
    type: object
info:
  contact: {}
paths:
  /repos/{owner}/{repo}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed information about a GitHub repository including
        name, description, stars, forks, and creation date.
      parameters:
      - description: Repository Owner username (e.g. golang)
        in: path
        name: owner
        required: true
        type: string
      - description: Repository Name (e.g. go)
        in: path
        name: repo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with repository details
          schema:
            $ref: '#/definitions/domain.RepoInfo'
        "400":
          description: 'Invalid input parameters: owner or repo is empty'
          schema:
            type: string
        "404":
          description: Repository not found on GitHub
          schema:
            type: string
        "500":
          description: 'Internal server error: failed to fetch data from collector'
          schema:
            type: string
      summary: Get repository information
      tags:
      - repos
swagger: "2.0"
